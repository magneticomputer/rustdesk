name: Record Play Store demo video

on:
  workflow_dispatch:

jobs:
  record:
    name: record FGS demo on Android emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download signed x86_64 APK from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download magnetic -R ${{ github.repository }} -p "rustdesk-*-x86_64-signed.apk" -O app.apk
          ls -la app.apk

      - name: Write tap helper
        run: |
          cat > tap_text.py <<'PYEOF'
          import re, sys, subprocess
          pattern = sys.argv[1]
          xml = open('ui.xml', encoding='utf-8', errors='ignore').read()
          best = None
          for m in re.finditer(r'<node[^>]*/?>', xml):
              node = m.group(0)
              txt = re.search(r'text="([^"]*)"', node)
              desc = re.search(r'content-desc="([^"]*)"', node)
              label = ((txt.group(1) if txt else '') + ' ' + (desc.group(1) if desc else '')).strip()
              # anchored patterns must not match the long explanatory paragraphs
              # that mention a button's name in brackets
              if re.search(pattern, label, re.I):
                  b = re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', node)
                  if b:
                      x = (int(b.group(1)) + int(b.group(3))) // 2
                      y = (int(b.group(2)) + int(b.group(4))) // 2
                      best = (x, y, label.strip()[:60])
                      break
          if best:
              print(f'tap "{best[2]}" at {best[0]},{best[1]}')
              subprocess.run(['adb', 'shell', 'input', 'tap', str(best[0]), str(best[1])])
          else:
              print(f'NOT FOUND: {pattern}')
          PYEOF

          # the emulator-runner action executes each script line separately, so
          # all multi-line logic lives in this file and script: is one line
          cat > demo.sh <<'SHEOF'
          #!/bin/bash
          set -x
          adb install -r app.apk

          tap_text() {
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true
            adb pull /sdcard/ui.xml ui.xml >/dev/null 2>&1 || true
            python3 tap_text.py "$1" || true
          }
          # dump the whole UI tree so failed matches can be diagnosed from the log
          dump_ui() {
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true
            adb pull /sdcard/ui.xml "ui_$1.xml" >/dev/null 2>&1 || true
            echo "--- UI $1 ---"
            python3 -c "
          import re,sys
          xml=open('ui_$1.xml',encoding='utf-8',errors='ignore').read()
          for m in re.finditer(r'<node[^>]*/?>',xml):
              n=m.group(0)
              t=re.search(r'text=\"([^\"]+)\"',n); d=re.search(r'content-desc=\"([^\"]+)\"',n)
              if t or d: print(' |', (t.group(1) if t else ''), '/', (d.group(1) if d else ''))
          " 2>/dev/null || true
          }
          snap() { adb exec-out screencap -p > "shot_$1.png" || true; }
          # the emulator sometimes throws "<app> isn't responding" over everything
          dismiss_anr() { tap_text "^Wait$|^Attendi$|^Close app$" >/dev/null 2>&1 || true; }

          # pre-grant the ancillary permissions the app asks for in a chain
          # (notifications, overlay) so the recording focuses on the screen-capture
          # consent, which is what the Play declaration is about
          adb shell pm grant computer.magnetic.support android.permission.POST_NOTIFICATIONS || true
          adb shell appops set computer.magnetic.support SYSTEM_ALERT_WINDOW allow || true
          adb shell appops set computer.magnetic.support MANAGE_EXTERNAL_STORAGE allow || true

          # let the freshly booted system settle, then clear any ANR dialog
          sleep 20
          dismiss_anr
          adb shell input keyevent KEYCODE_HOME ; sleep 2

          adb shell "screenrecord --bit-rate 6000000 --size 720x1600 /sdcard/demo.mp4" &
          RECPID=$!
          sleep 2

          adb shell am start -n computer.magnetic.support/com.carriez.flutter_hbb.MainActivity
          sleep 12
          dismiss_anr
          snap 01_home

          tap_text 'Allow|Consenti' ; sleep 3
          snap 02_after_notif

          # the service lives in the "Share screen" bottom tab, not on the home page
          tap_text 'Share screen|Condividi schermo' ; sleep 4
          snap 03_share_tab
          dump_ui share_tab

          # anchored: the grey paragraph above also contains "[Start service]"
          tap_text '^Start service$|^Avvia servizio$' ; sleep 5
          snap 04_after_start
          dump_ui after_start

          # anti-scam warning shown before the service starts
          tap_text '^I Agree$|^Accetto$|^OK$|^Ok$' ; sleep 4
          snap 04b_after_agree

          # any leftover permission dialog
          tap_text '^Allow$|^Consenti$' ; sleep 3
          snap 04c_after_allow

          # if a permission chain pushed us into Settings, come back to the app
          if adb shell dumpsys window 2>/dev/null | grep -q "mCurrentFocus.*com.android.settings"; then
            echo "in Settings — going back to the app"
            adb shell input keyevent KEYCODE_BACK ; sleep 2
            adb shell am start -n computer.magnetic.support/com.carriez.flutter_hbb.MainActivity ; sleep 5
            tap_text 'Share screen|Condividi schermo' ; sleep 3
            tap_text '^Start service$|^Avvia servizio$' ; sleep 4
            tap_text '^I Agree$|^Accetto$' ; sleep 4
          fi
          snap 04d_back_in_app
          dump_ui back_in_app

          dump_ui consent_dialog
          tap_text 'Start now|Inizia adesso|Avvia adesso|Start recording or casting|Entire screen' ; sleep 2
          tap_text 'Start now|Inizia adesso|Avvia adesso' ; sleep 5
          snap 05_after_consent
          dump_ui after_consent

          # linger on the running-service screen so the video shows the state
          snap 05b_service_running
          sleep 3

          adb shell cmd statusbar expand-notifications ; sleep 4
          snap 06_notifications
          dump_ui notifications
          sleep 3
          adb shell cmd statusbar collapse ; sleep 2

          adb shell am start -n computer.magnetic.support/com.carriez.flutter_hbb.MainActivity
          sleep 5
          snap 07_running

          adb shell pkill -INT screenrecord || true
          sleep 4
          wait $RECPID 2>/dev/null || true
          adb pull /sdcard/demo.mp4 demo.mp4
          ls -la demo.mp4
          SHEOF
          chmod +x demo.sh

      - name: Boot emulator, drive app, record video
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash demo.sh

      - name: Upload video and debug screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: play-demo-video
          path: |
            demo.mp4
            shot_*.png
